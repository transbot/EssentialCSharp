name: Report selected .NET runtimes
description: Execute a small probe for every target framework declared by Common.props
runs:
  using: composite
  steps:
    - name: Execute runtime probes
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $probeDirectory = Join-Path $env:RUNNER_TEMP ("dotnet-runtime-probe-" + [Guid]::NewGuid().ToString('N'))
        New-Item -ItemType Directory -Path $probeDirectory | Out-Null
        Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'global.json') $probeDirectory
        $commonPath = Join-Path $env:GITHUB_WORKSPACE 'Common.props'
        $escapedCommonPath = [System.Security.SecurityElement]::Escape($commonPath)
        $project = "<Project Sdk=`"Microsoft.NET.Sdk`"><Import Project=`"$escapedCommonPath`" /><PropertyGroup><OutputType>Exe</OutputType></PropertyGroup></Project>"
        Set-Content (Join-Path $probeDirectory 'RuntimeProbe.csproj') $project -Encoding utf8
        $source = @'
        System.Console.WriteLine($"Actual runtime: {System.Runtime.InteropServices.RuntimeInformation.FrameworkDescription}; version={System.Environment.Version}; architecture={System.Runtime.InteropServices.RuntimeInformation.ProcessArchitecture}");
        '@
        Set-Content (Join-Path $probeDirectory 'Program.cs') $source -Encoding utf8
        Push-Location $probeDirectory
        try {
          Write-Host "Probe SDK: $(dotnet --version)"
          dotnet build RuntimeProbe.csproj --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw "Runtime probe build failed: $LASTEXITCODE" }
          $frameworks = ([xml](Get-Content $commonPath -Raw)).Project.PropertyGroup.TargetFrameworks.Split(';')
          foreach ($framework in $frameworks) {
            Write-Host "Target framework: $framework"
            dotnet (Join-Path $probeDirectory "bin/Debug/$framework/RuntimeProbe.dll")
            if ($LASTEXITCODE -ne 0) { throw "Runtime probe failed for ${framework}: $LASTEXITCODE" }
          }
        } finally {
          Pop-Location
        }
