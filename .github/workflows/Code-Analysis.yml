name: .NET Code Analysis

on:
  push:
    branches: [ 'v[1-9][0-9].0', 'v12.0Chinese' ]
  pull_request:
    branches: [ 'v[1-9][0-9].0', 'v12.0Chinese' ]

jobs:
  NET-Code-Analysis:
    name: .NET Code Analysis runner
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify repository text encoding
        shell: pwsh
        run: python -X utf8 .github/scripts/check_utf8.py
      - name: Setup dotnet SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
            global-json-file: global.json
            dotnet-version: |
              6.0.x
              7.0.x
      - name: Get Build Information
        run: |
          dotnet --info
          dotnet --version
          dotnet --list-sdks
          dotnet --list-runtimes
      - name: Verify actual target runtimes
        uses: ./.github/actions/report-dotnet-runtime
      - name: Set up dependency caching for faster builds
        uses: actions/cache@v4
        id: nuget-cache
        with:
            path: |
              ~/.nuget/packages
              ${{ github.workspace }}/**/obj/project.assets.json
            key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
            restore-keys: |
              ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
              ${{ runner.os }}-nuget-
      # Run NuGet restore for the solution at repo root
      - name: Run NuGet restore
        run: dotnet restore

      # Use the SDK analyzers directly; the old Guardian wrapper requires .NET 3.1.
      - name: Run .NET Code Analysis
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/code-analysis.targets" <<'EOF'
          <Project>
            <Import Project="$(MSBuildStartupDirectory)/Directory.Build.targets" />
            <PropertyGroup>
              <AnalysisLogDirectory>$(MSBuildProjectDirectory)/obj/analysis/$(TargetFramework)</AnalysisLogDirectory>
              <ErrorLog>$(AnalysisLogDirectory)/analysis.sarif,version=2.1</ErrorLog>
            </PropertyGroup>
            <Target Name="CreateAnalysisLogDirectory" BeforeTargets="CoreCompile">
              <MakeDir Directories="$(AnalysisLogDirectory)" />
            </Target>
          </Project>
          EOF
          dotnet build --no-restore \
            -p:AnalysisLevel=latest \
            -p:AnalysisMode=Minimum \
            -p:EnforceCodeStyleInBuild=true \
            -p:DirectoryBuildTargetsPath="$RUNNER_TEMP/code-analysis.targets"

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis_results.sarif
          path: src/**/obj/analysis/**/*.sarif
          if-no-files-found: error
