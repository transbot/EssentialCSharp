name: Chinese and Cross-Locale Validation

on:
  push:
    branches: [ 'v[1-9][0-9].0', 'v12.0Chinese' ]
  pull_request:
    branches: [ 'v[1-9][0-9].0', 'v12.0Chinese' ]

jobs:
  set-build-and-test-locale-languages:
    name: ${{ matrix.label }} on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: zh_CN.UTF-8
            culture: zh-CN
            label: 简体中文主验证
          - locale: fr_FR.UTF-8
            culture: fr-FR
            label: 法语跨区域检查
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify repository text encoding
        shell: pwsh
        run: python -X utf8 .github/scripts/check_utf8.py
      - name: Setup dotnet SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
            global-json-file: global.json
            dotnet-version: |
              6.0.x
              7.0.x
      - name: Configure test locale
        shell: bash
        env:
          TEST_LOCALE: ${{ matrix.locale }}
        run: |
          sudo locale-gen "$TEST_LOCALE"
          sudo localectl set-locale LANG="$TEST_LOCALE"
          sudo update-locale LANG="$TEST_LOCALE"
          printf 'LANG=%s\nLC_ALL=%s\n' "$TEST_LOCALE" "$TEST_LOCALE" >> "$GITHUB_ENV"
      - name: Get Build Information
        run: |
          dotnet --info
          dotnet --version
          dotnet --list-sdks
          dotnet --list-runtimes
      - name: Verify actual target runtimes
        uses: ./.github/actions/report-dotnet-runtime
        with:
          expected-culture: ${{ matrix.culture }}
      - name: Set up dependency caching for faster builds
        uses: actions/cache@v4
        id: nuget-cache
        with:
            path: |
              ~/.nuget/packages
              ${{ github.workspace }}/**/obj/project.assets.json
            key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
            restore-keys: |
              ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
              ${{ runner.os }}-nuget-
      - name: Build and test all frameworks in the selected locale
        run: |
          echo Current Locale Settings:
          locale
          date
          echo Restore dependencies
          dotnet restore
          echo Build
          dotnet build --no-restore
          echo Test
          dotnet test --no-build --no-restore --verbosity normal
